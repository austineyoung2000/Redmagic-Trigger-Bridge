# Values are normalized from 0 through 10000 relative to the current display.
enabled=1
grab_devices=1
swap_triggers=0

# Trigger-down feedback through the NX809J zte_vibrator interface.
# Gain is clamped to 1..255 and duration to 1..1000 milliseconds.
haptics_enabled=1
haptic_gain=150
haptic_duration_ms=100

# Rotation 0: portrait; 1: landscape clockwise; 2: reverse portrait;
# 3: landscape counter-clockwise.
rot0_left_x=2500
rot0_left_y=5000
rot0_right_x=7500
rot0_right_y=5000
rot1_left_x=2500
rot1_left_y=5000
rot1_right_x=7500
rot1_right_y=5000
rot2_left_x=2500
rot2_left_y=5000
rot2_right_x=7500
rot2_right_y=5000
rot3_left_x=2500
rot3_left_y=5000
rot3_right_x=7500
rot3_right_y=5000
