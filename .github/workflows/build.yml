name: Build trigger bridge module

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure native build
        run: >-
          cmake -S daemon -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DANDROID_STL=none

      - name: Compile daemon
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          file build/redmagic-trigger-bridge
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h build/redmagic-trigger-bridge

      - name: Package flashable module
        run: |
          mkdir -p out
          cp build/redmagic-trigger-bridge out/redmagic-trigger-bridge
          chmod 0755 out/redmagic-trigger-bridge scripts/package.sh
          scripts/package.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmagic-Trigger-Bridge-module
          path: out/Redmagic-Trigger-Bridge-*.zip
          if-no-files-found: error
